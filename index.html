<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="logodevteddy">
    <img src="images/logo-devteddy.png">
</div>
<div id="menu">
    <img src="images/fullscreen.svg" id="fullscreenbtn">
    <img src="images/menu.svg" id="settingbtn">
</div>
<div class="container" id="app-container">
    <img src="images/eventlogo.png" id="logoevent" alt="">
    <div id="result"></div>
    <div><button id="drawButton">จับฉลาก</button></div>
</div>
<div class="container" id="settingscreen">
    <img src="images/close.svg" id="closesettingbtn">
    <div id="settingscreentitle">Lucky Draw</div>
    <div class="setting-section">
      <label>Screen Scale:</label>
      <div class="scale-buttons-container">
        <button id="btnScaleResponsive" class="scale-button active-scale-button" data-scale="responsive">Responsive</button>
        <button id="btnScale16x9" class="scale-button" data-scale="16:9">16:9</button>
        <button id="btnScale4x3" class="scale-button" data-scale="4:3">4:3</button>
      </div>
    </div>
    <textarea id="nameInput" placeholder="ระบุชื่อ (1 ชื่อ/บรรทัด)"></textarea>
    <div><button id="updateButton">Update Names</button></div>
</div>
<script src="script.js"></script>
</body>
</html>
